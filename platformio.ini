[platformio]
src_dir = .
default_envs = sniffer_v3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -Isrc
lib_deps =
    jgromes/RadioLib@^7.1.2

[env:sniffer_v3]
board = heltec_wifi_lora_32_V3
build_src_filter =
    -<*>
    +<src/>
    +<examples/01_Sniffer/main.cpp>

[env:sniffer_v4]
extends = env:sniffer_v3
board = esp32-s3-devkitc-1
board_build.arduino.variant = esp32s3
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:home_assistant_v3]
board = heltec_wifi_lora_32_V3
build_src_filter =
    -<*>
    +<src/>
    +<examples/02_HomeAssistant/main.cpp>
lib_deps =
    ${env.lib_deps}
    dawidchyrzynski/home-assistant-integration@^2.1.0

[env:home_assistant_v4]
extends = env:home_assistant_v3
board = esp32-s3-devkitc-1
board_build.arduino.variant = esp32s3
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:home_assistant_freertos_v3]
extends = env:home_assistant_v3
build_src_filter =
    -<*>
    +<src/>
    +<examples/03_HomeAssistant_FreeRTOS/main.cpp>

[env:home_assistant_freertos_v4]
extends = env:home_assistant_v4
build_src_filter = ${env:home_assistant_freertos_v3.build_src_filter}
